<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>Unky Mo — Chat</title>
<link rel="icon" type="image/svg+xml" href="/favicon/idle.svg" id="favicon">
<link rel="manifest" href="/manifest.json" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-title" content="Unky Mo">
<link rel="stylesheet" href="/style.css">
<script src="/theme.js"></script>
</head>
<body>
<div class="chat-shell" id="chat-shell">

  <nav class="chat-nav">
    <div class="chat-nav__brand">
      <span class="chat-nav__wordmark">Unky Mo</span>
      <a class="chat-nav__back" href="/">Dashboard</a>
      <button class="link-btn chat-nav__restart" type="button" data-restart-mo title="Restart the TUI, sidebars and web server (ctrl+alt+r)">Restart mo</button>
      <button class="link-btn chat-nav__restart" type="button" data-notify-settings hidden title="Get a notification on this device when a session needs you">Notifications</button>
    </div>
    <div class="chat-nav__list" id="session-nav"></div>
    <div class="chat-nav__inspector" id="inspector" hidden></div>
    <div class="chat-nav__usage" id="usage"></div>
  </nav>

  <main class="chat-main">
    <div class="chat-bar">
      <a class="chat-bar__back" href="/">Dashboard</a>
      <div class="chat-bar__title" id="chat-title">—</div>
      <div class="chat-bar__meta" id="chat-meta"></div>
      <span class="chat-bar__spacer"></span>
      <button class="link-btn link-btn--danger" id="stop-btn" type="button" style="display:none;" aria-label="Stop session">Stop<span class="chat-bar__stop-more"> session</span></button>
      <span class="status-badge" id="status-badge"></span>
    </div>

    <div class="editor-tabs" id="editor-tabs" hidden></div>

    <div class="chat-panel" id="chat-panel">
    <div class="chat-transcript" id="transcript-scroll">
      <div class="chat-transcript__inner" id="transcript"></div>
    </div>

    <footer class="chat-footer">
      <div class="chat-notice" id="chat-notice" style="display:none;"></div>
      <div class="permission-banner" id="permission-banner" style="display:none;">Waiting for permission — answer it in the terminal.</div>
      <div class="question-banner" id="question-banner" style="display:none;"></div>
      <div class="overview-strip" id="overview-strip" hidden></div>
      <div class="agent-strip" id="agent-strip" hidden></div>
      <div class="chat-spinner" id="spinner" hidden></div>
      <div class="composer-attachments" id="attachments" hidden></div>
      <form class="composer" id="composer">
        <button class="composer__attach" id="attach-btn" type="button" title="Attach images (or paste / drop them here)" aria-label="Attach images">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M21 11.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l8.6-8.6a3.7 3.7 0 0 1 5.2 5.2l-8.6 8.6a1.8 1.8 0 0 1-2.6-2.6l7.9-7.9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <textarea class="composer__input" id="prompt-input" rows="1" placeholder="Message this session" autocomplete="off"></textarea>
        <button class="composer__send" id="send-btn" type="submit">Send</button>
      </form>
      <div class="composer-mode" id="mode-chip" hidden></div>
      <div class="composer__error" id="send-error"></div>
    </footer>

    <section class="term-drawer" id="term-drawer" aria-label="Terminals" hidden></section>
    </div>

    <div class="editor-panel" id="editor-panel" hidden></div>
    <div class="overview-panel" id="overview-panel" hidden></div>
  </main>

  <aside class="files-pane" id="files-pane" hidden>
    <div class="files-pane__head">
      <span class="files-pane__title">Files</span>
      <span class="files-tabs">
        <button class="files-tab" data-mode="review" type="button" hidden>Review <span id="review-count"></span></button>
        <button class="files-tab is-active" data-mode="changed" type="button">Changed <span id="files-count"></span></button>
        <button class="files-tab" data-mode="all" type="button">All files</button>
        <button class="files-tab" data-mode="branch" type="button" hidden>Branch files</button>
        <button class="files-tab" data-mode="graph" type="button">Git log</button>
      </span>
    </div>
    <div class="files-pane__list" id="files-list"></div>
    <div class="files-pane__foot" id="files-foot"></div>
  </aside>

</div>
<script src="/vendor/codemirror.js"></script>
<script src="/common.js"></script>
<script src="/markdown.js"></script>
<script src="/actions.js"></script>
<script src="/notify-model.js"></script>
<script src="/notify.js"></script>
<script src="/files.js"></script>
<script src="/graph.js"></script>
<script src="/terminal.js"></script>
<script src="/spinner.js"></script>
<script src="/mode.js"></script>
<script src="/subagents.js"></script>
<script src="/review.js"></script>
<script src="/editor.js"></script>
<script src="/overview-model.js"></script>
<script src="/calls.js"></script>
<script src="/overview-map.js"></script>
<script src="/overview.js"></script>
<script src="/inspector.js"></script>
<script src="/reviewqueue.js"></script>
<script src="/attachments.js"></script>
<script src="/commands.js"></script>
<script src="/rails.js"></script>
<script src="/question-model.js"></script>
<script src="/permission-model.js"></script>
<script src="/diffview.js"></script>
<script src="/chat.js"></script>
</body>
</html>
