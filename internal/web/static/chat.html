<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unky Mo — Chat</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="chat-page">

  <header class="chat-header">
    <a class="chat-header__back plain" href="/">Dashboard</a>
    <div class="chat-header__row">
      <div style="display:flex;flex-direction:column;gap:12px;">
        <div class="chat-header__title" id="chat-title">—</div>
        <div class="chat-header__meta" id="chat-meta"></div>
      </div>
      <span class="status-badge" id="status-badge"></span>
    </div>
  </header>

  <div class="chat-transcript" id="transcript-scroll">
    <div class="chat-transcript__inner" id="transcript"></div>
  </div>

  <footer class="chat-footer">
    <div class="permission-banner" id="permission-banner" style="display:none;">A permission prompt is waiting in the terminal.</div>
    <div class="question-banner" id="question-banner" style="display:none;"></div>
    <form class="composer" id="composer">
      <input class="composer__input" id="prompt-input" type="text" placeholder="Message this session" autocomplete="off">
      <button class="composer__send" id="send-btn" type="submit">Send</button>
    </form>
    <div class="composer__error" id="send-error"></div>
  </footer>

</div>
<script src="/chat.js"></script>
</body>
</html>
