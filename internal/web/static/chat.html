<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unky Mo — Chat</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="chat-shell" id="chat-shell">

  <nav class="chat-nav">
    <div class="chat-nav__brand">
      <span class="chat-nav__wordmark">Unky Mo</span>
      <a class="chat-nav__back" href="/">Dashboard</a>
    </div>
    <div class="chat-nav__list" id="session-nav"></div>
    <div class="chat-nav__usage" id="usage"></div>
  </nav>

  <main class="chat-main">
    <div class="chat-bar">
      <a class="chat-bar__back" href="/">Dashboard</a>
      <div class="chat-bar__title" id="chat-title">—</div>
      <div class="chat-bar__meta" id="chat-meta"></div>
      <span class="chat-bar__spacer"></span>
      <button class="link-btn link-btn--danger" id="stop-btn" type="button" style="display:none;">Stop session</button>
      <span class="status-badge" id="status-badge"></span>
    </div>

    <div class="chat-transcript" id="transcript-scroll">
      <div class="chat-transcript__inner" id="transcript"></div>
    </div>

    <footer class="chat-footer">
      <div class="chat-notice" id="chat-notice" style="display:none;"></div>
      <div class="permission-banner" id="permission-banner" style="display:none;">Waiting for permission — answer it in the terminal.</div>
      <div class="question-banner" id="question-banner" style="display:none;"></div>
      <form class="composer" id="composer">
        <input class="composer__input" id="prompt-input" type="text" placeholder="Message this session" autocomplete="off">
        <button class="composer__send" id="send-btn" type="submit">Send</button>
      </form>
      <div class="composer__error" id="send-error"></div>
    </footer>

    <section class="term-drawer" id="term-drawer" hidden></section>
  </main>

  <aside class="files-pane" id="files-pane" hidden>
    <div class="files-pane__head">
      <span class="files-pane__title">Files</span>
      <span class="files-tabs">
        <button class="files-tab is-active" data-mode="changed" type="button">Changed <span id="files-count"></span></button>
        <button class="files-tab" data-mode="all" type="button">All files</button>
      </span>
    </div>
    <div class="files-pane__list" id="files-list"></div>
    <div class="files-pane__foot" id="files-foot"></div>
  </aside>

</div>
<script src="/common.js"></script>
<script src="/actions.js"></script>
<script src="/files.js"></script>
<script src="/chat.js"></script>
</body>
</html>
