<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unky Mo</title>
<link rel="icon" type="image/svg+xml" href="/favicon/idle.svg" id="favicon">
<link rel="manifest" href="/manifest.json" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-title" content="Unky Mo">
<link rel="stylesheet" href="/style.css">
<script src="/theme.js"></script>
</head>
<body>
<div class="page">

  <header class="dash-header">
    <div class="dash-header__brand">
      <div class="dash-header__wordmark">Unky Mo</div>
      <div class="dash-header__line">
        <div class="dash-header__subtitle" id="subtitle">mo web</div>
        <span class="theme-toggle" role="group" aria-label="Theme">
          <button class="theme-toggle__btn" type="button" data-theme-set="light">Light</button>
          <button class="theme-toggle__btn" type="button" data-theme-set="dark">Dark</button>
        </span>
      </div>
      <div class="dash-header__actions">
        <button class="link-btn dash-header__restart" type="button" data-restart-mo title="Restart the TUI, sidebars and web server (ctrl+alt+r)">Restart mo</button>
        <button class="link-btn dash-header__restart" type="button" data-notify-settings hidden title="Get a notification on this device when a session needs you">Notifications</button>
        <button class="link-btn dash-header__restart" type="button" data-trust-device hidden title="Install mo web's local CA on a phone or another device">Trust on another device</button>
      </div>
    </div>
    <div class="dash-header__usage" id="usage"></div>
  </header>

  <section class="section">
    <div class="section__heading">
      <h2>Sessions</h2>
      <span class="section__count" id="sessions-count"></span>
    </div>
    <div>
      <div class="sessions-head">
        <span>Status</span><span>Project</span><span>Window</span><span>Branch</span><span></span><span></span>
      </div>
      <div class="sessions-body" id="sessions-body"></div>
    </div>
  </section>

  <div class="content-grid">
    <section class="section content-grid__projects">
      <div class="section__heading">
        <h2>Projects</h2>
        <span class="section__count" id="projects-count"></span>
      </div>
      <div class="projects-list" id="projects-list"></div>
    </section>

    <section class="section content-grid__tickets">
      <div class="section__heading">
        <h2>Tickets</h2>
        <span class="section__count" id="tickets-count"></span>
      </div>
      <div>
        <div class="tickets-head">
          <span>Ticket</span><span>Title</span><span>Bucket</span><span>Priority</span>
        </div>
        <div class="tickets-body" id="tickets-body"></div>
      </div>
    </section>
  </div>

</div>
<script src="/common.js"></script>
<script src="/actions.js"></script>
<script src="/notify-model.js"></script>
<script src="/notify.js"></script>
<script src="/app.js"></script>
</body>
</html>
