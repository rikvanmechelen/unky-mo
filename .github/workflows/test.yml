name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true

      - name: Install tmux (for integration tests)
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: go vet
        run: go vet ./...

      - name: go test (unit)
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -30

      - name: go test (integration)
        run: go test -tags integration ./internal/tmux/... ./internal/integration/...

      # The expectfail suite intentionally encodes claims from CLAUDE.md that
      # current code may not satisfy. Failures here flag either a code drift
      # or a stale doc claim — informational only, never blocks CI.
      - name: go test (expectfail — informational)
        run: go test -tags expectfail ./... || true

      - name: mocks up-to-date
        run: |
          go install go.uber.org/mock/mockgen@latest
          make mocks
          git diff --exit-code -- '*mock_*.go' || (echo "::error::generated mocks are stale — run 'make mocks' and commit"; exit 1)

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.out
